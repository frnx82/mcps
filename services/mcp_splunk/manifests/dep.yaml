apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fabric-mta.fullname" . }}
  annotations:
    secret.reloader.stakater.com/reload: mta-cert-secret
  labels:
    {{- include "fabric-mta.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  updateStrategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "fabric-mta.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fabric-mta.selectorLabels" . | nindent 8 }}
      annotations:
        sidecar.istio.io/inject: "false"
        # Force a pod restart whenever the ConfigMap (wrapper.conf, *.xml)
        # changes. Without this, "helm upgrade" updates the ConfigMap but the
        # StatefulSet pod keeps the OLD mounted config (subPath mounts never
        # live-update), so config-file fixes appear to have "no effect".
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      imagePullSecrets:
      - name: registry-artigop-pull-creds
      shareProcessNamespace: true

      # Pod-level security context
      # NOTE: Image files are rw-rw---- root:root (GID 0). To read them,
      # supplementalGroups: [0] is needed, but GDC PSP blocks GID < 100.
      # Options:
      #   1. Request a Gatekeeper exception for supplementalGroups: [0]
      #   2. Override conf/ files via ConfigMap (see config-files/)
      #   3. Rebuild the image with 755 permissions
      # Uncomment when PSP exception is granted:
      # securityContext:
      #   supplementalGroups: [0]

      # ════════════════════════════════════════════════════════════
      # Volumes
      # ════════════════════════════════════════════════════════════
      volumes:
      # NOTE: conf-fixed and lib-fixed emptyDir volumes REMOVED.
      # The rebuilt image (Dockerfile.gdc-mta) has chown -R 1000:1000,
      # so image files are directly readable. No emptyDir copy needed.

      # ConfigMap volume (wrapper.conf, *.xml config files)
      - name: {{ .Values.configMap.name }}
        configMap:
          name: {{ .Values.configMap.name }}

      # PVC volume (var, log, data persistence)
      - name: {{ .Values.volumes.pvc.name }}
        persistentVolumeClaim:
          claimName: {{ .Values.volumes.pvc.name }}

      # TLS keystore secret (conditional)
      {{- if .Values.starttls.enabled }}
      - name: {{ .Values.secret.TLS_KEYSTORE_NAME }}
        secret:
          secretName: {{ .Values.secret.TLS_KEYSTORE_NAME }}
      {{- end }}

      # ════════════════════════════════════════════════════════════
      # Init Containers
      # ════════════════════════════════════════════════════════════
      initContainers:

      # ── Init 1: Diagnostics + lock cleanup + conf staging ──────
      - name: {{ .Chart.Name }}-init
        image: "{{ .Values.image.registry }}/{{ .Values.image.namespace }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        command:
        - "/bin/sh"
        - "-c"
        - |
          echo "=== Configured james_version = {{ .Values.james_version }} ==="
          echo "=== Listing /deployments ==="
          ls -la /deployments 2>/dev/null
          echo "=== Does /deployments/{{ .Values.james_version }} exist? ==="
          ls -la /deployments/{{ .Values.james_version }} 2>/dev/null || echo "!! MISSING: /deployments/{{ .Values.james_version }}"
          echo "=== Locating james-server-app*.jar (reveals the REAL lib path) ==="
          JAR=$(find / -name "james-server-app*.jar" 2>/dev/null | head -n1)
          [ -n "$JAR" ] && echo "REAL jar: $JAR" || echo "!! james-server-app jar not found anywhere"
          echo "=== Locating wrapper.jar ==="
          find / -name 'wrapper.jar' 2>/dev/null | head -n1
          echo "=== Locating ALL wrapper.conf (image's own + our mount) ==="
          for f in $(find / -name 'wrapper.conf' 2>/dev/null); do
            echo "--- $f"
            grep -E "REPO_DIR|APP_BASE|working.dir" "$f" 2>/dev/null
          done
          # Clean up stale lock/PID files from previous runs
          VAR=/deployments/{{ .Values.james_version }}/var
          rm -f "${VAR}/james.pid"
          rm -f "${VAR}/store/activemq/brokers/KahaDB/lock"
          rm -f "${VAR}/store/derby/"*.lck
          rm -f "${VAR}/store/lucene/write.lock"
          echo "=== Lock/PID cleanup done ==="
        volumeMounts:
        - name: {{ .Values.volumes.pvc.name }}
          mountPath: /deployments/{{ .Values.james_version }}/var
          subPath: var

      # NOTE: fix-permissions init container REMOVED.
      # The rebuilt image already has correct ownership (1000:1000).

      # ════════════════════════════════════════════════════════════
      # Main Container
      # ════════════════════════════════════════════════════════════
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.registry }}/{{ .Values.image.namespace }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL

        # Override entrypoint: bypass Tanuki wrapper, run Java directly.
        # The wrapper's "bin/james console" doesn't use exec, so PID 1 exits
        # and Kubernetes stops the container. run.sh uses "exec $JAVACMD"
        # which keeps Java as PID 1 (foreground).
        command:
        - "/bin/sh"
        - "-c"
        - |
          BASEDIR=/deployments/{{ .Values.james_version }}
          # Set working directory — Derby, ActiveMQ write relative to cwd
          cd "$BASEDIR"
          
          # Patch docker-entrypoint.sh: replace "bin/james console" with
          # "exec bin/run.sh" so Java stays as PID 1 (foreground).
          # This preserves ALL config setup (SMTP gateway, DB, etc.)
          ENTRYPOINT=$(find / -name "docker-entrypoint.sh" -type f 2>/dev/null | head -1)
          if [ -n "$ENTRYPOINT" ]; then
            cp "$ENTRYPOINT" /tmp/docker-entrypoint-patched.sh
            sed -i 's|.*/bin/james console.*|cd '"$BASEDIR"' \&\& exec '"$BASEDIR"'/bin/run.sh|' /tmp/docker-entrypoint-patched.sh
            chmod +x /tmp/docker-entrypoint-patched.sh
            echo "Starting James via patched entrypoint (run.sh, foreground)..."
            exec /tmp/docker-entrypoint-patched.sh
          else
            echo "WARN: docker-entrypoint.sh not found, starting run.sh directly"
            [ -f "$BASEDIR/bin/setenv.sh" ] && . "$BASEDIR/bin/setenv.sh"
            exec "$BASEDIR/bin/run.sh"
          fi

        env:
        - name: "SMTP_GATEWAYPORT"
          value: "{{ .Values.service.port }}"

        {{- if .Values.starttls.enabled }}
        - name: "MTA_SECRET"
          valueFrom:
            secretKeyRef:
              key: "{{ .Values.secret.MTA_SECRET }}"
              {{- if empty .Values.secret.TLS_KEYSTORE_PASSWORD_SECRET_NAME }}
              name: "{{ .Values.secret.NAME }}"
              {{- else }}
              name: "{{ .Values.secret.TLS_KEYSTORE_PASSWORD_SECRET_NAME }}"
              {{- end }}
        {{- end }}

        - name: "SMTP_WEBSSO_USERNAME"
          valueFrom:
            secretKeyRef:
              key: "{{ .Values.secret.SMTP_WEBSSO_USERNAME_KEY }}"
              name: "{{ .Values.secret.NAME }}"
        - name: "SMTP_WEBSSO_PASSWORD"
          valueFrom:
            secretKeyRef:
              key: "{{ .Values.secret.SMTP_WEBSSO_PASSWORD_KEY }}"
              name: "{{ .Values.secret.NAME }}"

        {{- range $key, $value := .Values.service }}
        {{- if (eq $key (upper $key)) }}
        - name: "{{ $key }}"
          value: "{{ $value }}"
        {{- end }}
        {{- end }}

        ports:
        - name: mta
          containerPort: {{ .Values.container.port }}
          protocol: TCP

        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          {{- $readinessProbe := .Values.readinessProbe -}}
          {{- $readinessProbe := unset $readinessProbe "enabled" -}}
          {{- toYaml $readinessProbe | nindent 12 }}
        {{- end }}

        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          {{- $livenessProbe := .Values.livenessProbe -}}
          {{- $livenessProbe := unset $livenessProbe "enabled" -}}
          {{- toYaml $livenessProbe | nindent 12 }}
        {{- end }}

        resources:
          {{- toYaml .Values.resources | nindent 12 }}

        volumeMounts:
        # NOTE: conf-fixed and lib-fixed mounts REMOVED.
        # Image conf/ and lib/ are used directly (owned by 1000:1000).

        # ── TLS keystore (conditional) ──
        {{- if .Values.starttls.enabled }}
        - name: {{ .Values.secret.TLS_KEYSTORE_NAME }}
          mountPath: /deployments/{{ .Values.james_version }}/conf/keystore.jks
          subPath: {{ .Values.secret.TLS_KEYSTORE_FILENAME }}
        {{- end }}

        # ── ConfigMap files (wrapper.conf, *.xml, etc.) ──
        {{- range $name, $bytes := .Files.Glob "config-files/*" }}
        - name: {{ $.Values.configMap.name }}
          mountPath: {{ $.Values.volumes.configmap.mountPath }}/{{ base $name }}
          subPath: {{ base $name }}
        {{- end }}

        # ── PVC mounts ──
        - name: {{ .Values.volumes.pvc.name }}
          mountPath: {{ .Values.volumes.pvc.mountPath }}
        - name: {{ .Values.volumes.pvc.name }}
          mountPath: /deployments/{{ .Values.james_version }}/log
          subPath: log
        - name: {{ .Values.volumes.pvc.name }}
          mountPath: /deployments/{{ .Values.james_version }}/var
          subPath: var