apiVersion: v1
kind: Pod
metadata:
  name: debug-wrapper
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  imagePullSecrets:
  - name: registry-artigop-pull-creds
  containers:
  - name: debug
    image: "<JAMES_IMAGE>"        # ← Replace with your NEW image
    command:
    - "sh"
    - "-c"
    - |
      echo "=== Checking wrapper.conf for daemonize ==="
      grep -i "daemonize" /deployments/james-server-app-3.6.1/conf/wrapper.conf || echo "NOT FOUND in wrapper.conf"
      echo ""
      echo "=== Last 5 lines of wrapper.conf ==="
      tail -5 /deployments/james-server-app-3.6.1/conf/wrapper.conf
      echo ""
      echo "=== Checking if wrapper runs in console mode ==="
      echo "Starting wrapper in console mode..."
      /deployments/james-server-app-3.6.1/bin/wrapper console /deployments/james-server-app-3.6.1/conf/wrapper.conf 2>&1 | head -50
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
        - ALL
