apiVersion: v1
kind: Pod
metadata:
  name: debug-dbconfig
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  imagePullSecrets:
  - name: registry-artigop-pull-creds
  containers:
  - name: debug
    image: "<JAMES_IMAGE>"
    command:
    - "sh"
    - "-c"
    - |
      echo "=== Looking for database config files ==="
      ls -la /deployments/james-server-app-3.6.1/conf/ | grep -i "database\|persist\|openjpa\|jdbc"
      echo ""
      echo "=== james-database.properties ==="
      cat /deployments/james-server-app-3.6.1/conf/james-database.properties 2>/dev/null || echo "NOT FOUND"
      echo ""
      echo "=== All .properties files in conf/ ==="
      ls /deployments/james-server-app-3.6.1/conf/*.properties 2>/dev/null || echo "No .properties files"
      echo ""
      echo "=== META-INF/persistence.xml ==="
      find /deployments -name "persistence.xml" 2>/dev/null | while read f; do
        echo "--- $f ---"
        cat "$f"
      done
      echo ""
      echo "=== Full conf/ listing ==="
      ls -la /deployments/james-server-app-3.6.1/conf/
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
        - ALL
