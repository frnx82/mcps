apiVersion: v1
kind: Pod
metadata:
  name: debug-find-wrapper
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  imagePullSecrets:
  - name: registry-artigop-pull-creds
  containers:
  - name: debug
    image: "<JAMES_IMAGE>"        # ← Replace with your NEW image
    command:
    - "sh"
    - "-c"
    - |
      echo "=== Finding wrapper binary ==="
      find / -name "wrapper" -type f 2>/dev/null
      echo ""
      echo "=== Finding all .sh scripts in bin/ ==="
      ls -la /deployments/james-server-app-3.6.1/bin/
      echo ""
      echo "=== Finding run.sh or start scripts ==="
      find / -name "run.sh" -o -name "james.sh" -o -name "start.sh" 2>/dev/null | head -10
      echo ""
      echo "=== What is the image ENTRYPOINT? ==="
      cat /usr/local/bin/uid_entrypoint 2>/dev/null || echo "not at /usr/local/bin/uid_entrypoint"
      echo ""
      echo "=== docker-entrypoint.sh content ==="
      find / -name "docker-entrypoint*" -exec cat {} \; 2>/dev/null | head -30
      echo ""
      echo "=== Check if wrapper.conf has daemonize ==="
      grep -i "daemonize" /deployments/james-server-app-3.6.1/conf/wrapper.conf
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
        - ALL
