apiVersion: v1
kind: Pod
metadata:
  name: debug-startup
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  imagePullSecrets:
  - name: registry-artigop-pull-creds
  containers:
  - name: debug
    image: "<JAMES_IMAGE>"        # ← Replace with your NEW image
    command:
    - "sh"
    - "-c"
    - |
      echo "=========================================="
      echo "=== FULL docker-entrypoint.sh content ==="
      echo "=========================================="
      find / -name "docker-entrypoint*" 2>/dev/null | while read f; do
        echo "--- FILE: $f ---"
        cat "$f"
        echo ""
      done
      echo ""
      echo "================================="
      echo "=== FULL run.sh content       ==="
      echo "================================="
      cat /deployments/james-server-app-3.6.1/bin/run.sh
      echo ""
      echo "================================="
      echo "=== FULL james (bin/james)    ==="
      echo "================================="
      cat /deployments/james-server-app-3.6.1/bin/james 2>/dev/null | tail -30
      echo ""
      echo "=== wrapper binary check ==="
      file /deployments/james-server-app-3.6.1/bin/wrapper 2>/dev/null || ls -la /deployments/james-server-app-3.6.1/bin/wrapper
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
        - ALL
